  if (!product) return T('ไม่พบสินค้า');
  const np = prompt('ราคาปลีกใหม่:', product.p);
  const nap = prompt('ราคาสมาชิกตัวแทนใหม่:', product.ap);
  const ndesc = prompt('รายละเอียดสินค้า:', product.desc || '');
  if (np !== null && np.trim() !== '' && Number.isFinite(Number(np)) && Number(np) >= 0) product.p = Number(np);
  if (nap !== null && nap.trim() !== '' && Number.isFinite(Number(nap)) && Number(nap) >= 0) product.ap = Number(nap);
  if (ndesc !== null) product.desc = ndesc;
  saveState(); R();
}
function toggleAgent(username) {
  const user = S.users.find(x => x.n === username);
  if (!user) return T('ไม่พบผู้ใช้งาน');
  user.ag = user.ag ? 0 : 1;
  if (S.u && S.u.n === username) S.u.ag = user.ag;
  saveState(); R();
}
function adjustBalance(username) {
  const user = S.users.find(x => x.n === username);
  if (!user) return T('ไม่พบผู้ใช้งาน');
  const input = prompt('ระบุจำนวนเงินที่ต้องการปรับ (ใส่ + เพื่อเพิ่ม, ใส่ - เพื่อลด):', '0');
  if (input === null) return;
  const amount = Number(input);
  if (!Number.isFinite(amount)) return T('กรุณากรอกจำนวนเงินให้ถูกต้อง');
  user.bal = (Number(user.bal) || 0) + amount;
  if (S.u && S.u.n === username) S.u.bal = user.bal;
  saveState(); T('ปรับยอดเงินของ ' + username + ' เป็น ' + user.bal + '฿ แล้ว'); R();
}

if(S.adminTab==='products')content=`<div class="row sp"><h3>หมวดหมู่สินค้า</h3><button class="chip sel" onclick="const name=prompt('ชื่อหมวดหมู่ใหม่:');const code=prompt('รหัสย่อ (เช่น nf, yt, sp):');if(name&&code){C.push({id:code,n:name,c:'#ff7a00',l:name[0],desc:''});saveState();R()}">+ เพิ่มหมวดหมู่</button></div>${C.map(c=>`<div class="cd row sp"><div><b>${c.n}</b> (${c.id})</div><button class="chip danger" onclick="if(confirm('ยืนยันลบหมวดหมู่นี้?')){C=C.filter(x=>x.id!='${c.id}');saveState();R()}">ลบ</button></div>`).join('')}<hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><div class="row sp"><h3>รายการสินค้าทั้งหมด</h3><button class="chip sel" onclick="const name=prompt('ชื่อสินค้า:');const catId=prompt('รหัสหมวดหมู่ (${C.map(x=>x.id).join(',')}):');const price=+prompt('ราคาปลีก (บาท):');const agentPrice=+prompt('ราคาสมาชิกตัวแทน (บาท):');if(name&&catId&&price){const newId=Date.now();P.push({id:newId,n:name,c:catId,p:price,ap:agentPrice||price,k:0,s:0,h:0,desc:''});K[newId]=[];saveState();R()}">+ เพิ่มสินค้าใหม่</button></div>${P.map(p=>`<div class=cd><div class="row sp"><b class=or>${p.n}</b><div><button class="chip ${p.h?'sel':''}" onclick="toggleHot(${p.id})">HOT</button><button class="chip danger" onclick="deleteProduct(${p.id})">ลบ</button></div></div><div class=mu>หมวดหมู่: ${cat(p.c).n} | ราคาปลีก: ${p.p}฿ | ราคาสมาชิกตัวแทน: ${p.ap}฿</div><div class=mu>สต็อก: ${p.k} ชิ้น | ขายแล้ว: ${p.s} ชิ้น</div><button class=btn style="padding:4px 8px;font-size:12px;margin-top:6px" onclick="editProduct(${p.id})">✏️ แก้ไขราคา/รายละเอียด</button></div>`).join('')}`;
if(S.adminTab==='stock')content=`<h3>จัดการคีย์ / สต็อกสินค้า</h3>${P.map(p=>`<div class=cd><b>${p.n}</b> (สต็อกคงเหลือ: <b class=or>${p.k}</b> ชิ้น)<div class=mu>ใส่คีย์/รหัสสินค้า 1 รายการต่อ 1 บรรทัด:</div><textarea id="stock_${p.id}" rows=3 placeholder="user:pass หรือ Link">${(K[p.id]||[]).join('\n')}</textarea><button class="btn p" style="padding:6px" onclick="saveStock(${p.id})">บันทึกสต็อก</button></div>`).join('')}`;
if(S.adminTab==='topups')content=`<h3>อนุมัติสลิปเติมเงิน</h3>${S.top.map(t=>`<div class=cd><div class="row sp"><b>คุณ ${t.u}</b><b class=or style="font-size:18px">${t.amt}฿</b></div><div class=mu>${t.ch} · ${t.t}</div>${t.slip?`<div style="margin:8px 0"><img src="${t.slip}" style="max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--bd)" onclick="window.open(this.src)"></div>`:'<div class=mu>ไม่มีรูปสลิป</div>'}<div class=mu style="margin-bottom:6px">สถานะปัจจุบัน: <b>${t.s}</b></div>${t.s==='รอตรวจสอบ'?`<div class=row><button class="btn p" style="background:#22c55e;border-color:#22c55e" onclick="approveTopup(${t.id})">✓ อนุมัติ</button><button class="btn danger" onclick="rejectTopup(${t.id})">✕ ปฏิเสธ</button></div>`:''}</div>`).join('')||'<p class=mu>ไม่มีรายการเติมเงิน</p>'}`;
if(S.adminTab==='users')content=`<h3>จัดการผู้ใช้งานระบบ</h3>${S.users.map(u=>`<div class=cd><div class="row sp"><b>${u.n}</b><span class=chip style="padding:2px 8px;font-size:11px">${u.role}</span></div><div class=mu>ยอดเงินคงเหลือ: <b class=or>${u.bal}฿</b> | เติมสะสม: ${u.tot}฿</div><div class=mu>สถานะตัวแทน: <b>${u.ag?'เป็นตัวแทน (ได้ราคาพิเศษ)':'สมาชิกทั่วไป'}</b></div><div class=row style="margin-top:8px"><button class="chip ${u.ag?'sel':''}" onclick="toggleAgent('${u.n}')">${u.ag?'ยกเลิกตัวแทน':'ตั้งเป็นตัวแทน'}</button><button class=chip onclick="adjustBalance('${u.n}')">💵 ปรับยอดเงิน</button></div></div>`).join('')}`;
if(S.adminTab==='settings')content=`<h3>ตั้งค่าร้านค้า</h3><div class=cd><label class=mu>ชื่อร้านค้า:</label><input id=st_name value="${SETTINGS.storeName}"><label class=mu>ข้อความประกาศหน้าหลัก (Banner):</label><input id=st_banner value="${SETTINGS.bannerMsg}"><label class=mu>เบอร์พร้อมเปย์ (PromptPay):</label><input id=st_pp value="${SETTINGS.promptpayNo}"><label class=mu>ชื่อบัญชีพร้อมเปย์:</label><input id=st_ppname value="${SETTINGS.promptpayName}"><label class=mu>LINE ID ร้านค้า:</label><input id=st_line value="${SETTINGS.lineId}"><button class="btn p" style="margin-top:10px" onclick="SETTINGS.storeName=$('#st_name').value;SETTINGS.bannerMsg=$('#st_banner').value;SETTINGS.promptpayNo=$('#st_pp').value;SETTINGS.promptpayName=$('#st_ppname').value;SETTINGS.lineId=$('#st_line').value;saveState();T('บันทึกการตั้งค่าร้านค้าแล้ว');R()">บันทึกการตั้งค่า</button></div>`;
return `<h2>ระบบหลังบ้าน (ADMIN PANEL)</h2><div class=sc style="margin-bottom:12px">${tabs.map(t=>`<button class="chip ${S.adminTab===t[0]?'sel':''}" onclick="S.adminTab='${t[0]}';R()">${t[1]}</button>`).join('')}</div>${content}`}};
const M={
auth:()=>`<div class=row style="border:1.5px solid var(--bd);border-radius:18px;padding:4px;margin-bottom:14px"><button class="tab ${S.m.tab===0?'on':''}" onclick="S.m.tab=0;R()">เข้าสู่ระบบ</button><button class="tab ${S.m.tab===1?'on':''}" onclick="S.m.tab=1;R()">สมัครสมาชิก</button></div><h3 class=or style="text-align:center">${S.m.tab===1?'สมัครสมาชิกใหม่':'เข้าสู่ระบบ'}</h3><input id=un placeholder="ชื่อผู้ใช้งาน (อย่างน้อย 3 ตัวอักษร)"><input id=pw type=password placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)">${S.m.tab===1?'<input id=pw2 type=password placeholder="ยืนยันรหัสผ่านอีกครั้ง">':''}<button class="btn p" onclick="doAuth()" style="margin-top:10px">${S.m.tab===1?'สมัครสมาชิก':'เข้าสู่ระบบ'}</button><div class=mu style="font-size:12px;text-align:center;margin-top:8px">ทดสอบระบบ: admin / 123456 หรือ demo / 123456</div>`,
cf:()=>`<h3 class=or>ยืนยันการสั่งซื้อ</h3>${S.m.it.map(x=>{const p=pd(x.id);return `<div class="row sp"><span>${p.n} ×${x.q}</span><b>${pr(p)*x.q}฿</b></div>`}).join('')}<hr style="border:0;border-top:1px solid var(--bd);margin:10px 0"><div class="row sp" style="font-size:16px"><b>ยอดรวมชำระ</b><b class=or style="font-size:20px">${tt(S.m.it)}฿</b></div><div class=mu style="margin:4px 0">ยอดเงินคงเหลือของคุณ: ${S.u.bal}฿</div><p style="color:#ef4444;font-size:12px;margin:8px 0">⚠️ สินค้าซื้อแล้วไม่รับเปลี่ยนคืนทุกกรณี กรุณาตรวจสอบให้เรียบร้อย</p><div class=row><button class="btn danger" onclick="S.m=null;R()">ยกเลิก</button><button class="btn p" onclick="pay()">ยืนยันสั่งซื้อ</button></div>`,
ok:()=>`<h3 class=or style="text-align:center">✅ สั่งซื้อสำเร็จ!</h3><p class=mu style="text-align:center">ตัดยอดเงิน ${S.m.tot}฿ เรียบร้อยแล้ว ข้อมูลรหัสสินค้าของคุณ:</p><div class=cd style="background:var(--bg)">${S.m.items.map(item=>`<div style="margin-bottom:8px"><b>${item.name}</b>${item.keys.map(k=>`<div class="key-box row sp"><span>${k}</span><button class=chip style="padding:2px 8px;font-size:11px" onclick="copyTxt('${k}')">ก๊อปปี้</button></div>`).join('')}</div>`).join('')}</div><button class="btn p" onclick="S.m=null;R()">ปิดหน้าต่าง</button><button class=btn onclick="S.m=null;go('hist')">ดูประวัติสั่งซื้อ</button>`};
const DR=()=>`<div class=ov style="justify-content:flex-start;padding:0" onclick="S.menu=0;R()"><div class=md style="height:100%;max-height:none;border-radius:0 24px 24px 0;max-width:280px" onclick="event.stopPropagation()"><div class="row sp" style="margin-bottom:14px"><b class=or style="font-size:20px">${SETTINGS.storeName}</b><button class=ib onclick="S.menu=0;R()">✕</button></div><div class=mu style="margin-bottom:10px">${SETTINGS.slogan}</div>${[['home','🏠','หน้าหลัก'],['shop','🛍️','สินค้าทั้งหมด'],['review','⭐','รีวิวจากลูกค้า'],['contact','🎧','ช่องทางติดต่อ']].map(x=>`<div class=mi onclick="go('${x[0]}')">${x[1]} ${x[2]}</div>`).join('')}<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bd)"><div class=mu style="font-weight:600;margin-bottom:6px">🎨 เลือกธีมสี</div><div class=row><button class="chip ${THEME==='light'?'sel':''}" style="flex:1" onclick="setTheme('light')">สว่าง</button><button class="chip ${THEME==='dark'?'sel':''}" style="flex:1" onclick="setTheme('dark')">มืด</button><button class="chip ${THEME==='warm'?'sel':''}" style="flex:1" onclick="setTheme('warm')">พาสเทล</button></div></div><div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bd)"><div class=mu style="font-weight:600;margin-bottom:6px">⚙️ สลับโหมดทดลอง</div><button class=btn style="padding:6px 10px;font-size:12px" onclick="if(!S.u){S.u=S.users.find(x=>x.role==='admin')}else{S.u=S.u.role==='admin'?S.users.find(x=>x.role==='user'):S.users.find(x=>x.role==='admin')}saveState();T('สลับเป็นผู้ใช้: '+S.u.n+' ('+S.u.role+')');R()">สลับเป็น ${S.u&&S.u.role==='admin'?'ลูกค้าทั่วไป (Demo)':'เจ้าของร้าน (Admin)'}</button></div>${S.u?`<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bd)"><div class=mu>เข้าสู่ระบบในชื่อ: <b>${S.u.n}</b></div><div class=mi style="color:#ef4444;border:0;padding:6px 0" onclick="S.u=null;saveState();R()">ออกจากระบบ</div></div>`:'<div class=mi style="border:0;color:var(--or);font-weight:600" onclick="login()">🔑 เข้าสู่ระบบ / สมัครสมาชิก</div>'}</div></div>`;
const H=()=>`<header><button class=ib onclick="S.menu=1;R()">☰</button><b onclick="go('home')">${SETTINGS.logoUrl?`<img src="${SETTINGS.logoUrl}" class=logo-img>`:''}${SETTINGS.storeName}</b>${S.u?`<button class=ib onclick="go('cart')">🛒${S.cart.length?`<i class=bd>${S.cart.length}</i>`:''}</button><button class=av onclick="go('profile')">${S.u.n[0].toUpperCase()}</button>`:'<button class="btn p" style="width:auto;margin:0;padding:6px 14px" onclick="login()">เข้าสู่ระบบ</button>'}`;
function R(){document.querySelector('#app').innerHTML=H()+V[S.v]()+ (S.cart.length&&S.v!=='cart'?`<button class="btn p cb" onclick="go('cart')">🛒 ${S.cart.length} รายการ · ${tt(S.cart)}฿ — ดูตะกร้า</button>`:'')+(S.menu?DR():'')+(S.m?`<div class=ov onclick="S.m=null;R()"><div class=md onclick="event.stopPropagation()"><button class=ib style="float:right" onclick="S.m=null;R()">✕</button>${M[S.m.t]()}</div></div>`:'')}
R();
</script>
</body>
</html>
